name: Update asset cache versions

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'privacy/**'
      - 'projects/signage/admin/**'
      - 'projects/signage/index.php'
      - 'index.html'
      - 'scripts/version_assets.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache-busting-main
  cancel-in-progress: false

jobs:
  update-versions:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SVG renderer
        run: python3 -m pip install "cairosvg==2.7.1"

      - name: Generate home screen icons from favicon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import cairosvg
          source = Path("assets/icons/favicon.svg")
          for size, filename in [(180, "apple-touch-icon.png"), (192, "icon-192.png"), (512, "icon-512.png")]:
              cairosvg.svg2png(url=str(source), write_to=str(source.parent / filename), output_width=size, output_height=size)
          PY

      - name: Refresh content hashes
        run: python3 scripts/version_assets.py

      - name: Commit updated asset URLs
        run: |
          git add index.html privacy/index.html projects/signage/admin/index.php projects/signage/admin/login.php projects/signage/index.php assets/icons/*.png
          if git diff --cached --quiet; then
            echo "Asset versions are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh asset cache versions [skip ci]"
          git push origin HEAD:main
