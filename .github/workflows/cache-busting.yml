name: Update asset cache versions

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'privacy/**'
      - 'projects/signage/admin/**'
      - 'index.html'
      - 'scripts/version_assets.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache-busting-main
  cancel-in-progress: false

jobs:
  update-versions:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh content hashes
        run: python3 scripts/version_assets.py

      - name: Commit updated asset URLs
        run: |
          if git diff --quiet -- index.html privacy/index.html projects/signage/admin/index.php projects/signage/admin/login.php; then
            echo "Asset versions are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html privacy/index.html projects/signage/admin/index.php projects/signage/admin/login.php
          git commit -m "chore: refresh asset cache versions [skip ci]"
          git push origin HEAD:main
