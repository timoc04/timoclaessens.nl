name: Portfolio CMS checks

on:
  push:
    branches: [main]
    paths:
      - '.htaccess'
      - 'scripts/test_public_headers.py'
      - 'scripts/test_cms_http.py'
      - 'admin/**'
      - 'scripts/backup_cms.py'
      - 'scripts/test_backup_cms.py'
      - 'scripts/.htaccess'
      - 'scripts/test_apache_protection.py'
      - 'index.html'
      - 'assets/js/main.js'
      - 'assets/js/projects.js'
      - '.github/workflows/portfolio-cms.yml'
  pull_request:
    paths:
      - '.htaccess'
      - 'scripts/backup_cms.py'
      - 'scripts/test_backup_cms.py'
      - 'scripts/.htaccess'
      - 'scripts/test_apache_protection.py'
      - 'scripts/test_public_headers.py'
      - 'scripts/test_cms_http.py'
      - 'admin/**'
      - 'index.html'
      - 'assets/js/main.js'
      - 'assets/js/projects.js'
      - '.github/workflows/portfolio-cms.yml'

permissions:
  contents: read

jobs:
  php-cms-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: PHP syntax check
        run: |
          find admin -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: CMS content regression checks
        run: php admin/tests/content_test.php
      - name: CMS revision validation checks
        run: php admin/tests/revisions_test.php
      - name: Project storage regression checks
        run: php admin/tests/projects_test.php
      - name: Homepage draft regression checks
        run: php admin/tests/drafts_test.php
      - name: Project draft regression checks
        run: php admin/tests/project_drafts_test.php
      - name: CMS HTTP integration checks
        run: python3 scripts/test_cms_http.py
      - name: CMS backup safety checks
        run: python3 scripts/test_backup_cms.py
      - name: Apache CMS access protection checks
        run: python3 scripts/test_apache_protection.py
      - name: Public HTML security header checks
        run: python3 scripts/test_public_headers.py
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/projects.js
          node --check admin/forms.js
          node --check admin/projects.js
          node --check admin/drafts.js
