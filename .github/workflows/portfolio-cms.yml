name: Portfolio CMS checks

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'index.html'
      - 'assets/js/main.js'
      - '.github/workflows/portfolio-cms.yml'
  pull_request:
    paths:
      - 'admin/**'
      - 'index.html'
      - 'assets/js/main.js'
      - '.github/workflows/portfolio-cms.yml'

permissions:
  contents: read

jobs:
  php-cms-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: PHP syntax check
        run: |
          find admin -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: CMS content regression checks
        run: php admin/tests/content_test.php
      - name: Check JavaScript syntax
        run: node --check assets/js/main.js
