name: Signage PHP security checks

on:
  pull_request:
    paths:
      - 'projects/signage/**'
      - '.github/workflows/signage-security.yml'
  push:
    branches: [main]
    paths:
      - 'projects/signage/**'
      - '.github/workflows/signage-security.yml'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Check PHP syntax
        run: |
          find projects/signage -type f -name '*.php' ! -name 'config.php' -print0 | xargs -0 -n1 php -l
      - name: Run security regression tests
        run: php projects/signage/tests/security_test.php

      - name: Run settings storage tests
        run: php projects/signage/tests/settings_test.php
